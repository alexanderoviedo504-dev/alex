<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyFlix - Tu catálogo de streaming</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <span class="logo">MyFlix</span>
      </div>
      <nav aria-label="Navegación principal">
        <ul>
          <li><a href="#catalog">Inicio</a></li>
          <li><a href="#catalog">Series</a></li>
          <li><a href="#catalog">Películas</a></li>
          <li><a href="#catalog">Novedades</a></li>
        </ul>
      </nav>
      <label class="search-bar" for="search">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input id="search" type="search" placeholder="Buscar" aria-label="Buscar en el catálogo" />
      </label>
    </header>

    <main>
      <section class="hero" role="region" aria-labelledby="hero-title">
        <div class="hero-content">
          <h1 id="hero-title">Destacado</h1>
          <div class="hero-meta">
            <span class="year">2023</span>
            <span class="duration">1h 57m</span>
            <span class="category">Acción</span>
          </div>
          <p class="hero-description">Explora historias increíbles con la plataforma de streaming que tú controlas.</p>
          <div class="button-group">
            <button class="button primary" type="button">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <path d="M8 5v14l11-7z" />
              </svg>
              Reproducir
            </button>
            <a class="button secondary" href="#catalog">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10" />
                <line x1="12" y1="8" x2="12" y2="12" />
                <line x1="12" y1="16" x2="12.01" y2="16" />
              </svg>
              Más información
            </a>
          </div>
        </div>
      </section>

      <div id="catalog"></div>
    </main>

    <div class="video-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="video-container">
        <button class="video-close" type="button" aria-label="Cerrar">×</button>
        <video controls preload="metadata"></video>
        <div class="video-details">
          <h2 class="modal-title" id="modal-title">Título del video</h2>
          <p class="modal-meta">2023 · 1h 57m · Acción</p>
          <p class="modal-description">Descripción del video.</p>
        </div>
      </div>
    </div>

    <script src="scripts/main.js" defer></script>
  </body>
</html>
